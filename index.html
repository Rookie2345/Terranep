<!doctype html>
<html lang="ne" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0B1220" />
    <meta name="description" content="TerraNep - A realistic, interactive 3D living terrain map of Nepal featuring real-time earthquakes, live weather, and air quality." />
    <title>TerraNep | टेरानेप - 3D Living Map of Nepal</title>
    
    <style>
      /* Pure inline CSS for instant, zero-delay splash screen */
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #0B1220;
        color: #F8FAFC;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.6s;
      }
      #app-splash.fade-out {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .splash-ring-container {
        position: relative;
        width: 90px;
        height: 90px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 24px;
      }
      .splash-pulse {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2px solid #3DD6F5;
        animation: splash-radar 2.2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
      }
      .splash-pulse-delayed {
        animation-delay: 1.1s;
      }
      .splash-icon {
        width: 52px;
        height: 52px;
        border-radius: 16px;
        background: linear-gradient(135deg, #16243D 0%, #0B1220 100%);
        border: 1px solid rgba(61, 214, 245, 0.4);
        box-shadow: 0 0 25px rgba(61, 214, 245, 0.3);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 2;
      }
      .splash-mountain {
        width: 28px;
        height: 28px;
        color: #3DD6F5;
      }
      .splash-title {
        font-size: 26px;
        font-weight: 700;
        letter-spacing: -0.5px;
        margin: 0;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .splash-badge {
        font-size: 11px;
        font-weight: 600;
        background: rgba(61, 214, 245, 0.15);
        color: #3DD6F5;
        padding: 2px 8px;
        border-radius: 999px;
        border: 1px solid rgba(61, 214, 245, 0.3);
      }
      .splash-subtitle {
        font-size: 13px;
        color: #94A3B8;
        margin-top: 6px;
        text-align: center;
      }
      .splash-loader-bar {
        width: 140px;
        height: 3px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 4px;
        overflow: hidden;
        margin-top: 28px;
        position: relative;
      }
      .splash-loader-bar::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        width: 40%;
        background: linear-gradient(90deg, transparent, #3DD6F5, transparent);
        border-radius: 4px;
        animation: splash-progress 1.5s ease-in-out infinite;
      }
      @keyframes splash-radar {
        0% { transform: scale(0.6); opacity: 0.9; }
        100% { transform: scale(1.6); opacity: 0; }
      }
      @keyframes splash-progress {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(350%); }
      }
    </style>
  </head>
  <body>
    <!-- Instant Branded Splash Screen -->
    <div id="app-splash">
      <div class="splash-ring-container">
        <div class="splash-pulse"></div>
        <div class="splash-pulse splash-pulse-delayed"></div>
        <div class="splash-icon">
          <svg class="splash-mountain" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m8 3 4 8 5-5 5 15H2L8 3z" />
          </svg>
        </div>
      </div>
      <h1 class="splash-title">
        <span>टेरानेप</span>
        <span class="splash-badge">3D</span>
      </h1>
      <p class="splash-subtitle">TerraNep • Nepal's 3D Living Terrain</p>
      <div class="splash-loader-bar"></div>
    </div>

    <div id="root"></div>

    <script>
      // Global splash dismissal helper
      window.dismissSplash = function() {
        const splash = document.getElementById('app-splash');
        if (splash && !splash.classList.contains('fade-out')) {
          splash.classList.add('fade-out');
          setTimeout(() => {
            if (splash.parentNode) splash.parentNode.removeChild(splash);
          }, 700);
        }
      };
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
